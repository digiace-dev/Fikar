; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit SSD1306@^2.5.7

[env:main]
; production environment - compile main.cpp dari folder src
build_src_filter = +<*> -<../test/*>

[env:test-blink]
build_src_filter = +<../test/test-blink.cpp>

[env:test-adc-sensor]
build_src_filter = +<../test/test-adc-sensor.cpp>

[env:test-relay]
build_src_filter = +<../test/test-relay.cpp>

[env:test-buzzer]
build_src_filter = +<../test/test-buzzer.cpp>

[env:test-i2c]
build_src_filter = +<../test/test-i2c.cpp>


[env:test-oled] ; testing environment untuk OLED I2C display
build_src_filter = +<../test/test-oled.cpp>  ; hanya compile file test-i2c.cpp, abaikan src/main.cpp
