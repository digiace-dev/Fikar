[env:nodemcu32]
platform = espressif32
board = nodemcu-32s
framework = arduino

[env:test-blink]
platform = espressif32
board = nodemcu-32s
framework = arduino
test_dir = test
test_speed = 115200

[env:test-adc-sensor]
platform = espressif32
board = nodemcu-32s
framework = arduino
test_dir = test
test_speed = 115200
